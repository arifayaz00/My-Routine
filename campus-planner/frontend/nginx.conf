limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/snippets/security-headers.conf;

  # login / register / password change: strict, shared across all clients of one IP
  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
  }
  # Server-Sent Events must not be buffered (live routine updates)
  location = /api/routine/stream {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    include /etc/nginx/snippets/security-headers.conf;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
  }
  # hashed build files can be cached forever; the shell and service worker must always revalidate
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location ~ ^/(sw\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location / { try_files $uri /index.html; }
}
