services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: planner
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      APP_ENV: production            # refuses weak secrets; schema comes from Alembic migrations
      DATABASE_URL: postgresql+psycopg2://planner:${DB_PASSWORD}@db:5432/planner
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (10+ characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TIMEZONE: ${TIMEZONE:-Asia/Dhaka}
      RETAKE_POLICY: ${RETAKE_POLICY:-latest}
      GRADE_SCALE: ${GRADE_SCALE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      UPLOAD_DIR: /srv/uploads
    volumes: [uploads:/srv/uploads]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    ports: ["${WEB_PORT:-80}:80"]

volumes:
  pgdata:
  uploads:
